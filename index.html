<!DOCTYPE html>
<html>
    <head>
        <title>DKN Game Audio</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="./resources/css/reset.css" rel="stylesheet">
        <link href="./resources/css/_variables.css" rel="stylesheet">
        <link href="./resources/css/fonts.css" rel="stylesheet">
        <link href="./resources/css/index.css" rel="stylesheet">
        <script src="./scripts/navigation.js" defer></script>
    </head>

    <body>
        <div id="app">

            <section id="character-select" class="view is-active">
                <div class="character-select-header">
                    <p>Character Select</p>
                    <hr>
                </div>
                <div class="card-wrapper">
                    <div data-target="portfolio-davide" class="card-outer">
                        <div class="card-inner">
                            <p class="card-numeral">I</p>
                            <div class="card-hero">
                                <p>D</p>
                            </div>
                            <hr>
                            <div class="card-name">
                                <span>Davide</span>
                                <span>Caldarone</span>
                            </div>
                            <p class="card-tagline">The Systems Thinker</p>
                        </div>
                    </div>

                    <div data-target="portfolio-cesare" class="card-outer">
                        <div class="card-inner">
                            <p class="card-numeral">II</p>
                            <div class="card-hero">
                                <p>C</p>
                            </div>
                            <hr>
                            <div class="card-name">
                                <span>Cesare</span>
                                <span>Chiari</span>
                            </div>
                            <p class="card-tagline">The World Builder</p>
                        </div>
                    </div>
                </div>
                <div class="character-select-footer">
                    <img src="./resources/images/DKNga_logoFair.png" alt="DKN Game Audio logo">
                    <p>Music · Sound Design · Implementation</p>
                </div>
            </section>

            <section id="portfolio-davide" class="view">
                <header class="portfolio-header">
                    <img src="./resources/images/DKNga_logoFair.png" data-target="character-select" alt="DKN Game Audio logo">
                    <button data-target="character-select">Character Select</button>
                </header>
            </section>

            <section id="portfolio-cesare" class="view">
                <header class="portfolio-header">
                    <img src="./resources/images/DKNga_logoFair.png" data-target="character-select" alt="DKN Game Audio logo">
                    <button data-target="character-select">Character Select</button>
                </header>
            </section>

        </div>
    </body>
</html>
